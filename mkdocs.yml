site_name: Purview
site_description: Authorization that speaks SQLAlchemy. Row-level policies and tenant isolation, in Python.
site_url: https://jestatsio.github.io/purview/
repo_url: https://github.com/jestatsio/purview
repo_name: jestatsio/purview
edit_uri: edit/main/docs/
copyright: Purview · MIT licensed

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jestatsio/purview
      name: Purview on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/purview-authz/
      name: Purview on PyPI

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
            members_order: source
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guides:
      - Writing policies: policies.md
      - FastAPI integration: fastapi.md
      - Debugging policies: debugging.md
      - Migrating from Oso: MIGRATING_FROM_OSO.md
  - Architecture:
      - Design: DESIGN.md
      - Security boundary: THREAT_MODEL.md
  - API reference: reference.md
