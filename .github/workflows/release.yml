name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/purview-authz
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.sha }}
          path: dist/
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --locked python scripts/release_notes.py "$RELEASE_TAG" release-notes.md
      - name: Create GitHub Release after publication
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Purview ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'a') || contains(github.ref_name, 'b') }}
